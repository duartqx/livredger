{{ define "lancamento" }}
<lancamento x-data="Lancamento({{ . | jsonify }})" class="d-flex py-3 border-box">
  <div class="col-3 d-flex align-items-center fs-06rem">
    <div
      x-text="dayjs.utc(value.timestamp).tz('America/Sao_Paulo').format('LLLL')"
    ></div>
  </div>
  <div class="col-2 fw-medium fs-06rem d-flex align-items-center">
    <span x-text="evento"></span>
  </div>
  <div class="col-4">
    <div x-text="value.descricao"></div>
    <div class="text-secondary fs-06rem" x-text="value.chave"></div>
  </div>
  <div class="col-2 d-flex justify-content-end">
    <div class="pe-2 d-flex flex-column align-items-end">
      <div class="text-end" x-text="valores.exibicao"></div>
      <tag
        :class="`${natureza.cor} fs-06rem text-end`"
        x-text="natureza.exibicao"
      ></tag>
    </div>
  </div>
  <div class="col-1 text-center p-0 d-flex justify-content-center align-items-center">
    <button
      class="btn btn-lighter bi bi-card-list"
      hx-get="/lancamentos/{{ .Chave }}"
      hx-target="main"
      hx-push-url="true"
      hx-swap="innerHTML"
      title="Detalhes do Lançamento"
    >
    </button>
  </div>
</lancamento>
{{ end }}
